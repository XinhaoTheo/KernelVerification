<svg viewBox="0 0 1500 360" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Proposed redesign of the Orchestrator diagram: every field RunState actually holds, grouped into six categories. The colored dot on each box is reused in the tool-call and permission tables in the README text below.">
  <title>Orchestrator diagram — redesign proposal (draft): shared state</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 19px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; }
    .b { font-size: 12px; font-weight: 700; }
    .xs { font-size: 10px; }
    .inkText { fill: #1f2937; }
    .faintText { fill: #6b7280; }
    .stateBox { fill: #fef3c7; stroke: #d97706; stroke-width: 1.6; }
    .stateText { fill: #78350f; }
    @media (prefers-color-scheme: dark) {
      .inkText { fill: #e5e7eb; }
      .faintText { fill: #9ca3af; }
      .stateBox { fill: #4a3a12; stroke: #fbbf24; }
      .stateText { fill: #fef3c7; }
    }
  </style>

  <text x="40" y="24" class="title inkText">Orchestrator — shared state (draft)</text>
  <text x="40" y="42" class="xs faintText">Not another pass at the agent-by-agent pipeline (see Figure 1) — this is everything RunState holds. See the tables below for which tool reads/writes which box.</text>

  <text x="40" y="70" class="h inkText">Shared State — every field RunState actually holds (verifier/agentic/state.py::RunState)</text>

  <rect x="40" y="82" width="460" height="118" rx="8" class="stateBox"/>
  <circle cx="60" cy="97" r="5" fill="#64748b"/>
  <text x="72" y="102" class="b stateText">Input (loaded once, read-only)</text>
  <text x="52" y="120" class="xs stateText">entry: dataset name</text>
  <text x="52" y="134" class="xs stateText">artifact: kernel.py · test.py · meta.json · problem.txt</text>
  <text x="52" y="152" class="xs stateText">skills[ ]: static guidance loaded into every prompt</text>
  <text x="52" y="170" class="xs faintText">set once by the Orchestrator's own load_artifact call,</text>
  <text x="52" y="184" class="xs faintText">never mutated by an agent turn</text>

  <rect x="520" y="82" width="460" height="118" rx="8" class="stateBox"/>
  <circle cx="540" cy="97" r="5" fill="#7c3aed"/>
  <text x="552" y="102" class="b stateText">Description</text>
  <text x="532" y="120" class="xs stateText">description_model: contract_model · kernel_model ·</text>
  <text x="532" y="134" class="xs stateText">risk_map · scope_notes · open_questions</text>
  <text x="532" y="152" class="xs stateText">description_tasks[ ]: open / resolved</text>
  <text x="532" y="170" class="xs stateText">description_updates[ ]: summary · task_ids ·</text>
  <text x="532" y="184" class="xs stateText">impact_on_claims</text>

  <rect x="1000" y="82" width="460" height="118" rx="8" class="stateBox"/>
  <circle cx="1020" cy="97" r="5" fill="#2563eb"/>
  <text x="1032" y="102" class="b stateText">Claims</text>
  <text x="1012" y="120" class="xs stateText">claims[ ]: id · statement · rationale · status ·</text>
  <text x="1012" y="134" class="xs stateText">raised_by · scope + scope_rationale + scope_evidence</text>
  <text x="1012" y="152" class="xs stateText">↳ evidence[ ] embedded in each claim</text>
  <text x="1012" y="166" class="xs faintText">(no separate evidence ledger)</text>
  <text x="1012" y="184" class="xs faintText">terminal status needs evidence with a matching `supports`</text>

  <rect x="40" y="212" width="460" height="118" rx="8" class="stateBox"/>
  <circle cx="60" cy="227" r="5" fill="#d97706"/>
  <text x="72" y="232" class="b stateText">Run Log</text>
  <text x="52" y="250" class="xs stateText">history[ ] (Turn): role · round · text · tool_calls ·</text>
  <text x="52" y="264" class="xs stateText">duration_s · usage</text>
  <text x="52" y="282" class="xs stateText">tool_events[ ] (ToolEvent): id · tool · args · status ·</text>
  <text x="52" y="296" class="xs stateText">output</text>
  <text x="52" y="314" class="xs faintText">every attempted call is recorded, incl. failed / rejected ones</text>

  <rect x="520" y="212" width="460" height="118" rx="8" class="stateBox"/>
  <circle cx="540" cy="227" r="5" fill="#0891b2"/>
  <text x="552" y="232" class="b stateText">Convergence / Skeptic Review</text>
  <text x="532" y="250" class="xs stateText">convergence: request (more_debate) · reason ·</text>
  <text x="532" y="264" class="xs stateText">focus_claims</text>
  <text x="532" y="282" class="xs stateText">skeptic_review: decision ·</text>
  <text x="532" y="296" class="xs stateText">reviewed_tool_event_count</text>
  <text x="532" y="314" class="xs faintText">Judge blocked from record_verdict until this is current</text>

  <rect x="1000" y="212" width="460" height="118" rx="8" class="stateBox"/>
  <circle cx="1020" cy="227" r="5" fill="#16a34a"/>
  <text x="1032" y="232" class="b stateText">Verdict (terminal outcome)</text>
  <text x="1012" y="250" class="xs stateText">verdict: trust / reject / needs_more_evidence ·</text>
  <text x="1012" y="264" class="xs stateText">confidence · reason · decisive_claims</text>
  <text x="1012" y="284" class="xs faintText">null until record_verdict — Judge only, set exactly once,</text>
  <text x="1012" y="298" class="xs faintText">then the workflow stops</text>

  <text x="40" y="344" class="xs faintText">Draft proposal — see ARCHITECTURE_REVIEW.md, "Align the Diagrams with the Implementation," for the issues this addresses.</text>
</svg>
