<svg viewBox="0 0 1500 1040" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Proposed redesign of the Orchestrator diagram: shared run state matches the real RunState fields (evidence embedded inside each claim, no separate evidence ledger), and the evidence loop is drawn as a claim-coverage loop nested inside the debate-round loop, gated by a Skeptic-review check before Judge.">
  <title>Orchestrator diagram — redesign proposal (draft)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="inkFill"/>
    </marker>
    <marker id="arrowFaint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="faintFill"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 20px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .b { font-size: 12px; font-weight: 700; }
    .s { font-size: 11px; }
    .xs { font-size: 10px; }
    .ink, .arrowLine { stroke: #1f2937; }
    .inkText { fill: #1f2937; }
    .inkFill { fill: #1f2937; }
    .faintText { fill: #6b7280; }
    .faintLine, .dashArrow, .containerLine { stroke: #6b7280; }
    .faintFill { fill: #6b7280; }
    .arrowLine { stroke-width: 2; fill: none; }
    .dashArrow { stroke-width: 1.6; fill: none; stroke-dasharray: 5,4; }
    .containerLine { stroke-width: 1.6; fill: none; stroke-dasharray: 3,5; }
    .agentBox { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .agentText { fill: #1e3a8a; }
    .stateBox { fill: #fef3c7; stroke: #d97706; stroke-width: 1.6; }
    .stateText { fill: #78350f; }
    .skillBox { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.6; }
    .skillText { fill: #4c1d95; }
    .toolBox { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.6; }
    .toolText { fill: #7f1d1d; }
    .gateBox { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.6; }
    .gateText { fill: #14532d; }
    @media (prefers-color-scheme: dark) {
      .ink, .arrowLine { stroke: #e5e7eb; }
      .inkText { fill: #e5e7eb; }
      .inkFill { fill: #e5e7eb; }
      .faintText { fill: #9ca3af; }
      .faintLine, .dashArrow, .containerLine { stroke: #9ca3af; }
      .faintFill { fill: #9ca3af; }
      .agentBox { fill: #1e3a5f; stroke: #60a5fa; }
      .agentText { fill: #dbeafe; }
      .stateBox { fill: #4a3a12; stroke: #fbbf24; }
      .stateText { fill: #fef3c7; }
      .skillBox { fill: #3b2f5e; stroke: #a78bfa; }
      .skillText { fill: #ede9fe; }
      .toolBox { fill: #4a2020; stroke: #f87171; }
      .toolText { fill: #fee2e2; }
      .gateBox { fill: #1f3d2b; stroke: #4ade80; }
      .gateText { fill: #dcfce7; }
    }
  </style>

  <text x="40" y="20" class="title inkText">Orchestrator — redesign proposal (draft)</text>

  <!-- Orchestrator header -->
  <rect x="40" y="30" width="1420" height="80" rx="10" class="stateBox"/>
  <text x="750" y="58" text-anchor="middle" class="h stateText">Orchestrator</text>
  <text x="750" y="78" text-anchor="middle" class="s stateText">agent scheduling · tool dispatch · convergence enforcement</text>
  <text x="750" y="96" text-anchor="middle" class="xs faintText">run_verification_workflow() · run_agents_sequential()</text>

  <line x1="750" y1="110" x2="750" y2="140" class="dashArrow" marker-end="url(#arrowFaint)" marker-start="url(#arrowFaint)"/>

  <!-- Shared Run State: 4 boxes matching real RunState fields -->
  <rect x="40" y="140" width="337" height="170" rx="10" class="stateBox"/>
  <text x="56" y="162" class="b stateText">Claims — evidence embedded, no separate ledger</text>
  <rect x="52" y="172" width="313" height="46" rx="6" class="stateBox" stroke-dasharray="2,3"/>
  <text x="60" y="188" class="xs stateText">id · statement · rationale · status ·</text>
  <text x="60" y="201" class="xs stateText">raised_by · scope + scope_rationale + scope_evidence</text>
  <line x1="70" y1="224" x2="70" y2="290" class="containerLine"/>
  <text x="80" y="238" class="xs stateText">↳ evidence[ ]:</text>
  <text x="80" y="251" class="xs stateText">id · kind · tool_event_id ·</text>
  <text x="80" y="264" class="xs stateText">summary · supports · data · artifacts</text>
  <text x="60" y="288" class="xs faintText">status → confirmed/rebutted/inconclusive needs</text>
  <text x="60" y="300" class="xs faintText">evidence with a matching `supports` value</text>

  <rect x="401" y="140" width="337" height="170" rx="10" class="stateBox"/>
  <text x="417" y="162" class="b stateText">Description</text>
  <text x="417" y="184" class="xs stateText">description_model: contract_model ·</text>
  <text x="417" y="197" class="xs stateText">kernel_model · risk_map · scope_notes ·</text>
  <text x="417" y="210" class="xs stateText">open_questions</text>
  <text x="417" y="232" class="xs stateText">description_tasks[ ]: id · reason_kind ·</text>
  <text x="417" y="245" class="xs stateText">question · status (open/resolved)</text>
  <text x="417" y="267" class="xs stateText">description_updates[ ]: id · summary ·</text>
  <text x="417" y="280" class="xs stateText">task_ids · impact_on_claims</text>

  <rect x="762" y="140" width="337" height="170" rx="10" class="stateBox"/>
  <text x="778" y="162" class="b stateText">Run Log</text>
  <text x="778" y="184" class="xs stateText">history[ ] (Turn): role · round · text ·</text>
  <text x="778" y="197" class="xs stateText">tool_calls</text>
  <text x="778" y="219" class="xs stateText">tool_events[ ] (ToolEvent): id · tool ·</text>
  <text x="778" y="232" class="xs stateText">args · status (ok/error) · output</text>
  <text x="778" y="254" class="xs faintText">every attempted call is recorded, incl.</text>
  <text x="778" y="267" class="xs faintText">failed ones — a tool error is not a</text>
  <text x="778" y="280" class="xs faintText">kernel-fault claim by itself</text>

  <rect x="1123" y="140" width="337" height="170" rx="10" class="stateBox"/>
  <text x="1139" y="162" class="b stateText">Convergence / Skeptic Review</text>
  <text x="1139" y="184" class="xs stateText">convergence: request (more_debate) ·</text>
  <text x="1139" y="197" class="xs stateText">reason · focus_claims</text>
  <text x="1139" y="219" class="xs stateText">skeptic_review: decision ·</text>
  <text x="1139" y="232" class="xs stateText">reviewed_tool_event_count</text>
  <text x="1139" y="254" class="xs faintText">Judge is blocked from record_verdict</text>
  <text x="1139" y="267" class="xs faintText">until skeptic_review is current for the</text>
  <text x="1139" y="280" class="xs faintText">latest evidence</text>

  <line x1="750" y1="310" x2="750" y2="345" class="dashArrow" marker-end="url(#arrowFaint)" marker-start="url(#arrowFaint)"/>
  <text x="764" y="332" class="xs faintText">① ② every role, every turn</text>

  <!-- Outer: Debate Round loop -->
  <rect x="40" y="355" width="1420" height="545" rx="14" class="containerLine" fill="none"/>
  <text x="56" y="376" class="b inkText">Debate Round Loop — repeats if Judge calls request_more_debate</text>

  <!-- Describer / Skeptic -->
  <rect x="100" y="390" width="300" height="80" rx="10" class="agentBox"/>
  <text x="250" y="418" text-anchor="middle" class="h agentText">Describer</text>
  <text x="250" y="438" text-anchor="middle" class="s agentText">builds / updates description model</text>

  <rect x="460" y="390" width="300" height="80" rx="10" class="agentBox"/>
  <text x="610" y="418" text-anchor="middle" class="h agentText">Skeptic</text>
  <text x="610" y="438" text-anchor="middle" class="s agentText">adds or refines claims</text>

  <line x1="400" y1="430" x2="460" y2="430" class="arrowLine" marker-end="url(#arrow)"/>

  <!-- Inner: Claim Coverage Loop -->
  <rect x="70" y="500" width="1360" height="240" rx="12" class="containerLine" fill="none"/>
  <text x="86" y="521" class="b inkText">Claim Coverage Loop — Experimenter repeats until every open claim is resolved</text>

  <rect x="100" y="545" width="190" height="90" rx="8" class="agentBox"/>
  <text x="195" y="570" text-anchor="middle" class="s agentText">Open Claim</text>
  <text x="195" y="588" text-anchor="middle" class="xs agentText">Skeptic:</text>
  <text x="195" y="601" text-anchor="middle" class="xs agentText">record_claim</text>

  <rect x="320" y="545" width="190" height="90" rx="8" class="agentBox"/>
  <text x="415" y="566" text-anchor="middle" class="xs agentText">① Experimenter requests</text>
  <text x="415" y="580" text-anchor="middle" class="s agentText">run_claim_probe</text>
  <text x="415" y="600" text-anchor="middle" class="xs agentText">designs the probe code</text>

  <rect x="540" y="545" width="190" height="90" rx="8" class="toolBox"/>
  <text x="635" y="566" text-anchor="middle" class="xs toolText">② Orchestrator executes,</text>
  <text x="635" y="580" text-anchor="middle" class="s toolText">stores ToolEvent</text>
  <text x="635" y="600" text-anchor="middle" class="xs toolText">raw result — not yet evidence</text>

  <rect x="760" y="545" width="210" height="90" rx="8" class="agentBox"/>
  <text x="865" y="566" text-anchor="middle" class="xs agentText">Experimenter:</text>
  <text x="865" y="580" text-anchor="middle" class="s agentText">finalize_probe_evidence</text>
  <text x="865" y="600" text-anchor="middle" class="xs agentText">appends evidence + sets status, atomically</text>

  <rect x="1000" y="545" width="190" height="90" rx="8" class="gateBox"/>
  <text x="1095" y="572" text-anchor="middle" class="s gateText">Claim Resolved</text>
  <text x="1095" y="592" text-anchor="middle" class="xs gateText">confirmed / rebutted /</text>
  <text x="1095" y="606" text-anchor="middle" class="xs gateText">inconclusive</text>

  <polygon points="1290,553 1350,590 1290,627 1230,590" class="gateBox"/>
  <text x="1290" y="586" text-anchor="middle" class="xs gateText">more open</text>
  <text x="1290" y="598" text-anchor="middle" class="xs gateText">claims?</text>

  <line x1="290" y1="590" x2="320" y2="590" class="arrowLine" marker-end="url(#arrow)"/>
  <line x1="510" y1="590" x2="540" y2="590" class="arrowLine" marker-end="url(#arrow)"/>
  <line x1="730" y1="590" x2="760" y2="590" class="arrowLine" marker-end="url(#arrow)"/>
  <line x1="970" y1="590" x2="1000" y2="590" class="arrowLine" marker-end="url(#arrow)"/>
  <line x1="1190" y1="590" x2="1230" y2="590" class="arrowLine" marker-end="url(#arrow)"/>

  <path d="M 1290 627 L 1290 670 L 195 670 L 195 635" class="arrowLine" marker-end="url(#arrow)"/>
  <text x="742" y="663" text-anchor="middle" class="xs inkText">yes — another open claim remains</text>

  <!-- Skeptic review + Judge -->
  <polygon points="620,795 700,825 620,855 540,825" class="gateBox"/>
  <text x="620" y="820" text-anchor="middle" class="xs gateText">Skeptic reviewed?</text>
  <text x="620" y="832" text-anchor="middle" class="xs gateText">record_no_new_claims</text>

  <path d="M 1350 590 L 1400 590 L 1400 760 L 620 760 L 620 795" class="arrowLine" marker-end="url(#arrow)"/>
  <text x="1000" y="750" text-anchor="middle" class="xs inkText">no — all claims resolved, check Skeptic review</text>

  <rect x="780" y="780" width="300" height="90" rx="10" class="agentBox"/>
  <text x="930" y="808" text-anchor="middle" class="h agentText">Judge</text>
  <text x="930" y="828" text-anchor="middle" class="s agentText">trust / reject / needs_more_evidence</text>
  <text x="930" y="846" text-anchor="middle" class="xs agentText">or request_more_debate</text>

  <line x1="700" y1="825" x2="780" y2="825" class="arrowLine" marker-end="url(#arrow)"/>
  <text x="740" y="815" text-anchor="middle" class="xs inkText">yes</text>

  <path d="M 620 855 L 620 885 L 250 885 L 250 470" class="dashArrow" marker-end="url(#arrowFaint)"/>
  <text x="440" y="878" text-anchor="middle" class="xs faintText">no — Judge is not called this round</text>

  <path d="M 780 825 L 100 825 L 100 470" class="arrowLine" marker-end="url(#arrow)"/>
  <text x="400" y="835" text-anchor="middle" class="xs inkText">request_more_debate → back to Describer</text>

  <path d="M 1080 825 L 1460 825 L 1460 340" class="arrowLine" marker-end="url(#arrow)"/>
  <text x="1300" y="815" text-anchor="middle" class="xs inkText">record_verdict → workflow stops</text>

  <!-- Legend -->
  <rect x="40" y="965" width="18" height="18" rx="4" class="agentBox"/>
  <text x="66" y="979" class="s inkText">Agent turn</text>
  <rect x="180" y="965" width="18" height="18" rx="4" class="stateBox"/>
  <text x="206" y="979" class="s inkText">Shared state (Orchestrator)</text>
  <rect x="430" y="965" width="18" height="18" rx="4" class="toolBox"/>
  <text x="456" y="979" class="s inkText">Tool (role-scoped)</text>
  <polygon points="620,965 634,974 620,983 606,974" class="gateBox"/>
  <text x="644" y="979" class="s inkText">Gate / terminal outcome</text>
  <line x1="850" y1="974" x2="880" y2="974" class="arrowLine" marker-end="url(#arrow)"/>
  <text x="888" y="979" class="s inkText">tool call / control flow</text>
  <line x1="1150" y1="974" x2="1180" y2="974" class="dashArrow" marker-end="url(#arrowFaint)"/>
  <text x="1188" y="979" class="s inkText">reads shared context</text>

  <text x="40" y="1020" class="xs faintText">Draft proposal — see ARCHITECTURE_REVIEW.md, "Align the Diagrams with the Implementation," for the issues this addresses.</text>
</svg>
