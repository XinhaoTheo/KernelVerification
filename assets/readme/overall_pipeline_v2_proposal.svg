<svg viewBox="0 0 1500 760" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Proposed redesign of the agentic verification pipeline: Describer/Skeptic/Experimenter/Judge turns are mediated entirely through Orchestrator-held shared state, tool access is scoped per role, and a Skeptic-review gate blocks Judge until evidence is reviewed.">
  <title>Overall agentic pipeline — redesign proposal (draft, not final)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="inkFill"/>
    </marker>
    <marker id="arrowFaint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="faintFill"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 20px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .b { font-size: 12px; font-weight: 700; }
    .s { font-size: 11px; }
    .xs { font-size: 10px; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .ink, .arrowLine { stroke: #1f2937; }
    .inkText { fill: #1f2937; }
    .inkFill { fill: #1f2937; }
    .faintText { fill: #6b7280; }
    .faintLine, .dashArrow { stroke: #6b7280; }
    .faintFill { fill: #6b7280; }
    .arrowLine { stroke-width: 2; fill: none; }
    .dashArrow { stroke-width: 1.6; fill: none; stroke-dasharray: 5,4; }
    .agentBox { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .agentText { fill: #1e3a8a; }
    .stateBox { fill: #fef3c7; stroke: #d97706; stroke-width: 1.6; }
    .stateText { fill: #78350f; }
    .skillBox { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.6; }
    .skillText { fill: #4c1d95; }
    .toolBox { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.6; }
    .toolText { fill: #7f1d1d; }
    .gateBox { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.6; }
    .gateText { fill: #14532d; }
    @media (prefers-color-scheme: dark) {
      .ink, .arrowLine { stroke: #e5e7eb; }
      .inkText { fill: #e5e7eb; }
      .inkFill { fill: #e5e7eb; }
      .faintText { fill: #9ca3af; }
      .faintLine, .dashArrow { stroke: #9ca3af; }
      .faintFill { fill: #9ca3af; }
      .agentBox { fill: #1e3a5f; stroke: #60a5fa; }
      .agentText { fill: #dbeafe; }
      .stateBox { fill: #4a3a12; stroke: #fbbf24; }
      .stateText { fill: #fef3c7; }
      .skillBox { fill: #3b2f5e; stroke: #a78bfa; }
      .skillText { fill: #ede9fe; }
      .toolBox { fill: #4a2020; stroke: #f87171; }
      .toolText { fill: #fee2e2; }
      .gateBox { fill: #1f3d2b; stroke: #4ade80; }
      .gateText { fill: #dcfce7; }
    }
  </style>

  <text x="40" y="20" class="title inkText">Agentic verification pipeline — redesign proposal (draft)</text>

  <!-- Row 1: Dataset / Orchestrator / Protocol -->
  <rect x="360" y="30" width="200" height="100" rx="10" class="stateBox"/>
  <text x="460" y="68" text-anchor="middle" class="h stateText">Dataset</text>
  <text x="460" y="88" text-anchor="middle" class="s stateText">kernel.py + problem.txt</text>
  <text x="460" y="103" text-anchor="middle" class="s stateText">+ test.py + meta.json</text>

  <rect x="580" y="30" width="560" height="100" rx="10" class="stateBox"/>
  <text x="860" y="60" text-anchor="middle" class="h stateText">Orchestrator</text>
  <text x="860" y="82" text-anchor="middle" class="s stateText">holds all shared state below · dispatches every tool call</text>
  <text x="860" y="98" text-anchor="middle" class="s stateText">no agent ever calls another agent directly</text>
  <text x="860" y="117" text-anchor="middle" class="xs faintText">run_verification_workflow()</text>

  <rect x="1160" y="30" width="300" height="100" rx="10" class="ink" fill="none"/>
  <text x="1310" y="48" text-anchor="middle" class="b inkText">Agent Runtime Protocol</text>
  <text x="1178" y="68" class="s inkText">① agent reads state, emits one tool_call</text>
  <line x1="1178" y1="76" x2="1442" y2="76" class="faintLine" stroke-width="1"/>
  <text x="1178" y="94" class="s inkText">② orchestrator executes tool, appends</text>
  <text x="1188" y="108" class="s inkText">result, resumes the agent</text>

  <line x1="560" y1="80" x2="580" y2="80" class="arrowLine" marker-end="url(#arrow)"/>

  <!-- Row 2: Shared state strip -->
  <rect x="580" y="150" width="128" height="70" rx="8" class="stateBox"/>
  <text x="644" y="176" text-anchor="middle" class="s stateText">Description</text>
  <text x="644" y="192" text-anchor="middle" class="s stateText">Model</text>

  <rect x="724" y="150" width="128" height="70" rx="8" class="stateBox"/>
  <text x="788" y="176" text-anchor="middle" class="s stateText">Claim Ledger</text>
  <text x="788" y="192" text-anchor="middle" class="xs stateText">(evidence embedded</text>
  <text x="788" y="204" text-anchor="middle" class="xs stateText">per claim)</text>

  <rect x="868" y="150" width="128" height="70" rx="8" class="stateBox"/>
  <text x="932" y="176" text-anchor="middle" class="s stateText">Tool Events</text>
  <text x="932" y="192" text-anchor="middle" class="xs stateText">every call, incl.</text>
  <text x="932" y="204" text-anchor="middle" class="xs stateText">failures</text>

  <rect x="1012" y="150" width="128" height="70" rx="8" class="stateBox"/>
  <text x="1076" y="176" text-anchor="middle" class="s stateText">Convergence /</text>
  <text x="1076" y="192" text-anchor="middle" class="s stateText">Skeptic Review</text>

  <line x1="930" y1="220" x2="930" y2="270" class="dashArrow" marker-end="url(#arrowFaint)" marker-start="url(#arrowFaint)"/>
  <text x="944" y="248" class="xs faintText">① ② every role, every turn</text>

  <!-- Left column: Skills + Tools -->
  <rect x="40" y="270" width="280" height="110" rx="10" class="skillBox"/>
  <text x="60" y="292" class="b skillText">Skills (static guidance)</text>
  <text x="60" y="312" class="xs skillText">kernel-verification · evidence-driven-review ·</text>
  <text x="60" y="326" class="xs skillText">claim-lifecycle · experiment-design ·</text>
  <text x="60" y="340" class="xs skillText">adversarial-precision · metric-selection ·</text>
  <text x="60" y="354" class="xs skillText">scope-policy · convergence</text>
  <text x="60" y="372" class="xs faintText">loaded into the agent's prompt, not executed</text>

  <rect x="40" y="400" width="280" height="210" rx="10" class="toolBox"/>
  <text x="60" y="422" class="b toolText">Tools (role-scoped)</text>
  <text x="60" y="443" class="s toolText"><tspan font-weight="700">Read (all):</tspan> inspect_problem ·</text>
  <text x="60" y="457" class="s toolText">inspect_kernel_source · read_artifact_file ·</text>
  <text x="60" y="471" class="s toolText">read_claim_ledger</text>
  <text x="60" y="491" class="s toolText"><tspan font-weight="700">Describer:</tspan> request_description ·</text>
  <text x="60" y="505" class="s toolText">record_description_update</text>
  <text x="60" y="525" class="s toolText"><tspan font-weight="700">Skeptic:</tspan> record_claim ·</text>
  <text x="60" y="539" class="s toolText">record_no_new_claims</text>
  <text x="60" y="559" class="s toolText"><tspan font-weight="700">Experimenter:</tspan> run_claim_probe ·</text>
  <text x="60" y="573" class="s toolText">finalize_probe_evidence</text>
  <text x="60" y="593" class="s toolText"><tspan font-weight="700">Judge:</tspan> request_more_debate ·</text>
  <text x="60" y="607" class="s toolText">record_verdict</text>

  <line x1="320" y1="325" x2="360" y2="325" class="dashArrow" marker-end="url(#arrowFaint)"/>
  <text x="322" y="315" class="xs faintText">guides</text>

  <path d="M 320 505 L 400 505 L 400 380" class="arrowLine" marker-end="url(#arrow)"/>
  <text x="326" y="497" class="xs faintText">executes, scoped by role</text>

  <!-- Row 3: main debate loop -->
  <rect x="360" y="270" width="220" height="110" rx="10" class="agentBox"/>
  <text x="470" y="298" text-anchor="middle" class="h agentText">Describer</text>
  <text x="470" y="318" text-anchor="middle" class="s agentText">builds the description</text>
  <text x="470" y="332" text-anchor="middle" class="s agentText">model; no claims, no verdict</text>

  <rect x="612" y="270" width="220" height="110" rx="10" class="agentBox"/>
  <text x="722" y="298" text-anchor="middle" class="h agentText">Skeptic</text>
  <text x="722" y="318" text-anchor="middle" class="s agentText">files testable claims;</text>
  <text x="722" y="332" text-anchor="middle" class="s agentText">reviews evidence before Judge</text>

  <rect x="864" y="270" width="220" height="110" rx="10" class="agentBox"/>
  <text x="974" y="298" text-anchor="middle" class="h agentText">Experimenter</text>
  <text x="974" y="318" text-anchor="middle" class="s agentText">runs probes, attaches</text>
  <text x="974" y="332" text-anchor="middle" class="s agentText">evidence, updates status</text>

  <polygon points="1161,283 1201,325 1161,367 1121,325" class="gateBox"/>
  <text x="1161" y="317" text-anchor="middle" class="xs gateText">Skeptic</text>
  <text x="1161" y="329" text-anchor="middle" class="xs gateText">reviewed?</text>

  <rect x="1238" y="270" width="220" height="110" rx="10" class="agentBox"/>
  <text x="1348" y="298" text-anchor="middle" class="h agentText">Judge</text>
  <text x="1348" y="318" text-anchor="middle" class="s agentText">trust / reject /</text>
  <text x="1348" y="332" text-anchor="middle" class="s agentText">needs_more_evidence</text>

  <line x1="580" y1="325" x2="612" y2="325" class="arrowLine" marker-end="url(#arrow)"/>
  <line x1="832" y1="325" x2="864" y2="325" class="arrowLine" marker-end="url(#arrow)"/>
  <line x1="1084" y1="325" x2="1121" y2="325" class="arrowLine" marker-end="url(#arrow)"/>
  <text x="1102" y="315" text-anchor="middle" class="xs faintText">yes</text>
  <line x1="1201" y1="325" x2="1238" y2="325" class="arrowLine" marker-end="url(#arrow)"/>

  <!-- Loop-back band -->
  <path d="M 1348 380 L 1348 430 L 470 430 L 470 380" class="arrowLine" marker-end="url(#arrow)"/>
  <text x="905" y="423" text-anchor="middle" class="xs inkText">continue debate → request_more_debate (Judge, no)</text>

  <path d="M 974 380 L 974 470 L 722 470 L 722 380" class="arrowLine" marker-end="url(#arrow)"/>
  <text x="850" y="463" text-anchor="middle" class="xs inkText">evidence attached → Skeptic re-reviews</text>

  <path d="M 1000 380 L 1000 510 L 420 510 L 420 380" class="arrowLine" marker-end="url(#arrow)"/>
  <text x="850" y="503" text-anchor="middle" class="xs inkText">request_description — Skeptic / Experimenter / Judge → Describer</text>

  <!-- Legend -->
  <rect x="40" y="655" width="18" height="18" rx="4" class="agentBox"/>
  <text x="66" y="669" class="s inkText">Agent turn</text>
  <rect x="180" y="655" width="18" height="18" rx="4" class="stateBox"/>
  <text x="206" y="669" class="s inkText">Shared state (Orchestrator)</text>
  <rect x="430" y="655" width="18" height="18" rx="4" class="skillBox"/>
  <text x="456" y="669" class="s inkText">Skill (prompt guidance)</text>
  <rect x="660" y="655" width="18" height="18" rx="4" class="toolBox"/>
  <text x="686" y="669" class="s inkText">Tool (role-scoped)</text>
  <polygon points="920,655 934,664 920,673 906,664" class="gateBox"/>
  <text x="944" y="669" class="s inkText">Gate / convergence check</text>
  <line x1="1150" y1="664" x2="1180" y2="664" class="arrowLine" marker-end="url(#arrow)"/>
  <text x="1188" y="669" class="s inkText">tool call / control flow</text>
  <line x1="1150" y1="690" x2="1180" y2="690" class="dashArrow" marker-end="url(#arrowFaint)"/>
  <text x="1188" y="695" class="s inkText">reads shared context (no tool call)</text>

  <text x="40" y="730" class="xs faintText">Draft proposal — see ARCHITECTURE_REVIEW.md, "Align the Diagrams with the Implementation," for the issues this addresses.</text>
</svg>
